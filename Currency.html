<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
    <title>Convert</title>
</head>
<body>
 <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">KNOW IT</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Sports
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main>

        <section class="form_currency">
            <form>
                <div class="currency_from&to">
                    <label for="fromm">From</label>
                    <input list="from" id="fromm" placeholder="Select Currency">
                    <datalist id="from">
                        <option value="EGP"></option>
                        <option value="USD"></option>
                        
                   
                    </datalist>

                    <label for="too">To</label>
                    <input list="to" id="too" placeholder="Select Currency">
                    <datalist id="to">
                        <option value="EGP"></option>
                        <option value="USD"></option>
                    
                   
                    </datalist>
                </div>

                <div class="currency_amount">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount">
                
                    <button id="btn_form" type="submit">Convert</button>
                </div>
                
                <p id="results"></p>
                
            </form>


        </section>


    </main>


    <script src="Jscode/Currency.js"></script>

</body>
</html>
